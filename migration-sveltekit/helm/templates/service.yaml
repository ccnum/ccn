apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.service.name | default "ccn-service" }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.app.publishedPort | default 8890 }}
      targetPort: {{ .Values.app.port | default 3000 }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-ccn
