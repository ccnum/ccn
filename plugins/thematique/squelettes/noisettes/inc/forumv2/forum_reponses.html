<BOUCLE_reponse(FORUMS){id_parent}>

    <div id="forum-#ID_FORUM" class="forum-card">
            
        
        <B_nb_reponses>
            <div class="forum-card__badge">
                #TOTAL_BOUCLE réponses
            </div>
        </B_nb_reponses>
        <BOUCLE_nb_reponses(FORUMS)
            {id_parent=#ID_FORUM}
        >
        </BOUCLE_nb_reponses>
    
        
        <div class="col-forum">
            <div class="forum-card__icon">
                icone
            </div>
    
        </div>
        <div class="col-forum">
            <div class="header">
                <h3>titre : #TITRE</h3>
                <div>
                    date : [(#DATE|affdate)]
                </div>
            </div>
            <div class="content">
                <div>
                    texte :
                    [(#TEXTE|couper{180})]
    
                    <a href="#URL_FORUM">
                        Lire la suite du commentaire
                    </a>
    
                </div>
            </div>
            <div class="footer">
                <div>id forom #ID_FORUM</div>
                <B_reponses>
                    <a href="#forum-#ID_FORUM">
                        Voir les réponses
                    </a>
                </B_reponses>
                <BOUCLE_reponses(FORUMS)
                    {id_parent=#ID_FORUM}
                    {0,1}
                >
                </BOUCLE_reponses>
    
                <button
                    type="submit"
                    name="id_parent"
                    value="#ID_FORUM"
                >
                    Répondre
                </button>
            </div>
        </div>
    </div> 

</BOUCLE_reponse>
