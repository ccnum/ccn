<div class="forum-commentaire">

    <INCLURE
        {fond=noisettes/inc/forumv2/forum_card}
        {forum=#ENV{forum}}
    />
    <div class="repondre-form">
        <div class="ajax">
            #FORMULAIRE_FORUM_V2{
                #ENV{forum}|table_valeur{id_objet},
                #ENV{forum}|table_valeur{id_forum}
            }
        </div>
    </div>
    <div class="forum-formulaire-reponse-zone"></div>
    <B_reponses>
        <div class="reponse-list">
            <BOUCLE_reponses(DATA){
                source tableau, 
                #ENV{forum}|table_valeur{reponses}
            }>
                <INCLURE
                    {fond=noisettes/inc/forumv2/forum_commentaire_et_ses_reponses}
                    {forum=#VALEUR}
                />
            </BOUCLE_reponses>
        </div>
    </B_reponses>

</div>
