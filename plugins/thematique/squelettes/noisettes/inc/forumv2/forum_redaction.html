<div class="forum-redaction">
	<h2><:thematique:redaction_commentaire:></h2>
	[(#ENV**{erreurs/message_erreur})]
	<p><:thematique:redigez_commentaire:></p>
	[(#ENV{id_parent}|>{0}|oui)
		<p class="forum-redaction__reponse-a"><:thematique:reponse_a_commentaire_existant:></p>
	]
	<p id="texte-erreur" class="erreur" role="alert">[(#ENV**{erreurs/texte})]</p>
	<div class="editer">
		<label for="texte" class="sr-only"><:thematique:redigez_commentaire:></label>
		<textarea id="texte" name="texte" rows="2" class="forum-redaction__textarea" aria-describedby="texte-erreur">[(#ENV{texte}|entites_html)]</textarea>
	</div>
	<div style="display: flex; 
				justify-content: end;
				padding-top: 0.8rem;"
	>
		<div class="forum-actions">
			<button onclick="callbackCliqueSurAnnuler(event)" 
					type="button"
					class="link-button cancel-button"
			>
				<:thematique:annuler:>
			</button>
			<button type="submit" 
					name="publication_forum_action" 
					value="previsualiser"
					class="previsualisation-button"
			>
				<:forum:previsualiser:>	
			</button>
		</div>
	</div>
</div>
