<div class="forum-redaction">
    <h2>Rédaction de votre commentaire</h2>
    [(#ENV**{erreurs/message_erreur})]
    <p>
        Choisissez un titre et rédigez votre commentaire sur cette réponse.
    </p>
    [(#ENV{id_parent}|>{0}|oui)
        <p class="forum-redaction__reponse-a">
            Vous répondez à un commentaire existant.
        </p>
    ]
    [(#ENV**{erreurs/titre})]
    <div class="editer">
        <label for="titre">
            Titre
        </label>
        <input
            id="titre"
            name="titre"
            type="text"
            value="#ENV{titre}"
        />
    </div>
    [(#ENV**{erreurs/texte})]
    <div class="editer">
        <label for="texte">
            Commentaire
        </label>
        <textarea
            id="texte"
            name="texte"
            rows="8"
        >#ENV{texte}</textarea>
    </div>
    <div class="forum-actions">
        <button 
            type="submit" 
            name="publication_forum_action"  
            value="annuler"
            class="btn-link"
        >
            Annuler
        </button>
        <button
            type="submit"
            name="publication_forum_action" 
            value="previsualiser">
            Prévisualiser
        </button>
    </div>
</div>
