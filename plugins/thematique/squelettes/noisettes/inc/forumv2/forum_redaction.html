<div class="forum-redaction">
	<h2><:thematique:redaction_commentaire:></h2>
	[(#ENV**{erreurs/message_erreur})]
	<p><:thematique:redigez_commentaire:></p>
	[(#ENV{id_parent}|>{0}|oui)
		<p class="forum-redaction__reponse-a"><:thematique:reponse_a_commentaire_existant:></p>
	]
	[(#ENV**{erreurs/texte})]
	<div class="editer">
		<textarea id="texte" name="texte" rows="2" class="forum-redaction__textarea">[(#ENV{texte}|entites_html)]</textarea>
	</div>
	<div style="display: flex; justify-content: end;">
		<div class="forum-actions">
			<button onclick="callbackCliqueSurAnnuler(event)" type="button"><:thematique:annuler:></button>
			<button type="submit" name="publication_forum_action" value="previsualiser"><:thematique:previsualiser:></button>
		</div>
	</div>
</div>
