<div class="forum-preview">
	<h2>Vérification de votre commentaire</h2>
	<p>Relisez votre commentaire avant de le publier.</p>
	<div class="forum-card forum-card--preview">
		<div class="forum-card__header">
			<div class="forum-card__left">
				<div class="forum-card__icon">icone</div>
				<h3>#SESSION{nom_classe}</h3>
			</div>
			<div class="forum-card__date">[(#DATE|affdate)]</div>
		</div>
		<div class="forum-card__body">
			[(#ENV{texte}|propre)]
		</div>
	</div>
	<div class="forum-actions">
		<button type="submit" name="publication_forum_action" value="rediger" class="btn-link">Retour</button>
		<button type="submit" name="publication_forum_action" value="publier">Poster mon commentaire</button>
	</div>
</div>
