<div class="forum-preview forum-creation">
	<h2><:thematique:verification_commentaire:></h2>
	<p><:thematique:relisez_commentaire:></p>

	[(#SET{date_heure,[(#ENV{date}|affdate{'d/m/Y H:i'})]})]
	[(#SET{texte,[(#ENV{texte}|propre)]})]


	<INCLURE{fond=noisettes/inc/forumv2/forum_card,
		nombre_reponses=0,
		nom_auteur=#ENV{nom_auteur},
		date_heure=#GET{date_heure},
		texte=#GET{texte},
		id_rubrique_classe=(#SESSION{id_auteur}|classe_id_rubrique_auteur),
		est_une_previsualisation=oui,
		is_root=oui
	}>
	<div class="footer-creation-forum">
		<div class="forum-actions">
			<button type="submit" name="publication_forum_action" value="rediger" class="link-button cancel-button"><:thematique:retour:></button>
			<button type="submit" name="publication_forum_action" value="publier" class="bouton-lisere"><:thematique:poster_commentaire:></button>
		</div>
	</div>
</div>
