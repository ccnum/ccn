<div class="forum-article">

    <!-- Formulaire nouveau commentaire -->
    <div class="forum-commentaire-racine ajax">

        #FORMULAIRE_FORUMV2{
            #ENV{id_article},
            0
        }

    </div>


    <!-- Arbre des commentaires -->
    <div class="forum-liste">

        [(#ENV{id_article}|afficher_forum_arbre)]

    </div>


    <!-- Formulaire de réponse unique -->
    <div
        id="forum-formulaire-reponse"
        class="forum-formulaire-reponse ajax"
        hidden
    >

        #FORMULAIRE_FORUMV2{
            #ENV{id_article},
            0
        }

    </div>

</div>
