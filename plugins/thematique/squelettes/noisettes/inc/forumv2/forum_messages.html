<div>debut messages #ENV{id_article}</div>
<div class="message-list">
    <BOUCLE_discussions(FORUMS)
        {objet=article}
        {id_objet=#ENV{id_article}}
        {id_parent=0}
        {par date}
        {inverse}
    >
        <div id="forum-#ID_FORUM" class="forum-card">
            
        
            <B_nb_reponses>
                <div class="forum-card__badge">
                    #TOTAL_BOUCLE réponses
                </div>
            </B_nb_reponses>
            <BOUCLE_nb_reponses(FORUMS)
                {id_parent=#ID_FORUM}
            >
            </BOUCLE_nb_reponses>
        
            
            <div class="col-forum">
                <div class="forum-card__icon">
                    icone
                </div>
        
            </div>
            <div class="col-forum">
                <div class="header">
                    <h3>titre : #TITRE</h3>
                    <div>
                        date : [(#DATE|affdate)]
                    </div>
                </div>
                <div class="content">
                    <div class="forum-card__body" style="display: flex;">
                        texte :
                        [(#TEXTE|couper{180})]
        
                        <a href="#URL_FORUM">
                            Lire la suite du commentaire
                        </a>
        
                    </div>
                </div>
                <div class="footer">
                    <div>id forom #ID_FORUM</div>
                    <B_reponses>
                        <a href="#forum-#ID_FORUM">
                            Voir les réponses
                        </a>
                    </B_reponses>
                    <BOUCLE_reponses(FORUMS)
                        {id_parent=#ID_FORUM}
                        {0,1}
                    >
                    </BOUCLE_reponses>
        
                    <button
                        type="submit"
                        name="repondre_a"
                        value="#ID_FORUM"
                    >
                        Répondre
                    </button>
                </div>
            </div>
        </div>  
    </BOUCLE_discussions>
</div>
