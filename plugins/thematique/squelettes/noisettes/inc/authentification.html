#CACHE{0}
[(#SESSION{id_auteur}|oui)
<div id="menu_haut_user" class="bloc_titre">
	<div id="choix_rubrique_user" name="rubrique_user" class="selectbox" data-select-name="rubrique_user">
		<button type="button" class="select-toggle first_label">
			<span class="icon icon-connecter"></span>
			[(#SESSION{nom})]
			<span class="icon icon-down"></span>
		</button>
		<ul class="select-options">
			<li class="select-option me-deconnecter">
				<a href="[(#URL_LOGOUT)]" title="<:thematique:me_deconnecter:>" style="display: flex; align-items: center;" class="nowrap">
					<:thematique:me_deconnecter:>
				</a>
			</li>
		</ul>
	</div>
</div>
]
[(#SESSION{id_auteur}|non)
<div id="menu_haut_user" class="bloc_titre">
	<div id="choix_connexion" name="connexion" class="selectbox" data-select-name="connexion">
		<button type="button" class="select-toggle first_label">
			<span class="icon icon-connecter"></span><:thematique:me_connecter:>
			<span class="icon icon-down"></span>
		</button>
		<ul class="select-options">
			[(#PLUGIN{cioidc}|oui)
				<li class="select-option">
					<a href="[(#URL_PAGE{login}|parametre_url{url,#SELF}|parametre_url{cioidc,oui})]" title="<:thematique:se_connecter_ent:>" class="nowrap">
						<:thematique:se_connecter_ent:>
					</a>
				</li>
			]
		</ul>
	</div>
</div>
]
