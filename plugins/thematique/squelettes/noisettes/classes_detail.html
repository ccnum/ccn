#CACHE{0}
[(#REM) Navigation latérale : liste des classes participantes, pour naviguer entre les classes depuis la colonne "Bibliothèque"]

<BOUCLE_principale(RUBRIQUES){id_rubrique}{tout}>

	<div class="popup [popup_(#ENV{type_objet})]">

		<div class="sidebar_bubble">
			<div class="fiche_titre couleur_texte_travail_en_cours couleur_travail_en_cours0">
				<div class="texte">
					<div class="titre"><:thematique:les_classes_participantes:></div>
				</div>
			</div>
		</div>

		<div class="sidebar_bubble">
			<div class="bloc_option_doc nettoyeur">
				<div style="clear:both" class="bloc_option_reponses_consignes_classe">
					<div class="nettoyeur"></div>

					<BOUCLE_classes(RUBRIQUES){id_parent=#ID_RUBRIQUE}{par titre}{tout}{0,50}>
						<div class="ressources_rubrique">
							<button type="button" class="ressource_rubrique_titre btn-reset" id="ajax_go_to_classe_#ID_RUBRIQUE" onclick="callClasse('#ID_RUBRIQUE')"><h3>#TITRE</h3></button>
						</div>
					</BOUCLE_classes>

					<div class="introduction nettoyeur"></div>
				</div>
			</div>
		</div>

	</div>

</BOUCLE_principale>
