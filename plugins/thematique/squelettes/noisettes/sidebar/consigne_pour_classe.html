#CACHE{0}
<INCLURE{fond=noisettes/sidebar/inc/entete_commun, env} />

<div class="[popup_(#ENV{type_objet})]">
	<div id="bloc_article-#ID_ARTICLE" class="bloc_article[ (#GET{police})]">
		#SET{titre_consigne_final, #GET{titre_consigne}|sinon{#TITRE}}
		<INCLURE{fond=noisettes/sidebar/inc/entete_container, fond_header=noisettes/sidebar/header_sidebar, env} />

		<div id="tabs-article-#ID_ARTICLE" class="container-tabs">
			<div id="mission-tabs">
				<div>
					<div class="tabs-title">
						<:thematique:description_mission:>
					</div>
					<div class="tabs-content">
						<INCLURE{
							fond=noisettes/sidebar/onglet_description_role_simple,
							id_article=#GET{id_consigne},
							env
						} />
					</div>
				</div>
				<INCLURE{fond=noisettes/sidebar/inc/onglet_commentaires_tab, libelle_cle=thematique:titre_onglet_comentaire_pour_classe, env} />
			</div>
		</div>
	</div>
</div>
