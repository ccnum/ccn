<BOUCLE_article_sidebar(ARTICLES){id_article}{tout}>
<div class="sidebar_bubble">
	<div id="row_header">
		<INCLURE{fond=noisettes/sidebar/inc/header_gauche_photo_auteur, id_article=#ID_ARTICLE} />
		<div id="header-col-right">
			<div style="display: flex;
                        justify-content: end;">
                <INCLURE{fond=noisettes/sidebar/normal_header_icons, env} />
            </div>
            <div style="font-weight: 700;
                        font-size: 14px;"
            >
                [(#TITRE)]
                [(#AUTORISER{modifier,article,#ID_ARTICLE}|oui)
                <button type="button" class="bouton-modifier-article btn-reset" onclick="callModifierArticle(#ID_ARTICLE, '#ENV{type_objet}')"><:thematique:modifier:></button>
                ]
            </div>
		</div>
	</div>
</div>
</BOUCLE_article_sidebar>
