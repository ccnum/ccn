<!--debut header consigne-->

<BOUCLE_article_sidebar(ARTICLES){id_article}{tout}>
<div class="sidebar_bubble">
	<div id="row_header">
		<INCLURE{fond=noisettes/sidebar/inc/header_gauche_photo_auteur, id_article=#ID_ARTICLE} />
		<div id="header-col-right">
			<div id="header-row-1">
				#SET{est_jalon, non}
				<BOUCLE_test_jalon_header(MOTS){id_article}{titre IN cap-sur-l-annee,la-rencontre}>
					#SET{est_jalon, oui}
				</BOUCLE_test_jalon_header>
				#SET{numero_mission, #ENV{rang}|sinon{0}|plus{1}}
				<div class="etiquette-etape">
					[(#GET{est_jalon}|=={oui}|oui)<span class="texte-etiquette">[(#TITRE)]</span>]
					[(#GET{est_jalon}|=={non}|oui)<span class="texte-etiquette"><:thematique:mission_numero{numero=#GET{numero_mission}}:></span>]
				</div>
				<INCLURE{fond=noisettes/sidebar/normal_header_icons, env} />
			</div>
			<div id="header-row-2">
				#TITRE
			</div>
		</div>
	</div>
</div>
</BOUCLE_article_sidebar>

<!--fin header consigne-->
