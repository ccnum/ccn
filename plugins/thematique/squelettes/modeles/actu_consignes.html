<BOUCLE_consigne(ARTICLES){id_article=#ID_OBJET}{tout}>
	#SET{titre_consigne,#TITRE}
	#SET{date_consigne,#DATE}
	#SET{auteur_consigne,#LESAUTEURS*}
	<BOUCLE_auteur(RUBRIQUES){id_rubrique}{tout}>#SET{auteur_consigne0,#TITRE}</BOUCLE_auteur>

	<button type="button" class="actualites-actu bgc_classe_[(#ID_RUBRIQUE|classe_numero)] js-call-consigne btn-reset" data-id-objet="#ID_OBJET">
		<span class="profil">[(#MODELE{logo_carre, taille=17}{id_rubrique=#ID_RUBRIQUE}{titre=#TITRE})]</span>
		<span class="actualites-titre"><:thematique:nouvelle_consigne_de_sur{auteur=#GET{auteur_consigne},titre=#GET{titre_consigne}}:></span><br>
		<p class="actualites-actu-date">[(#DATE_MODIF|affdate)]</p>
		<!--<div class="actualites-actu-date">[(#GET{date_consigne}|affdate)]</div>
		<div class="actualites-texte #EDIT{texte}">[(#TEXTE|couper{80})]</div>-->
	</button>
</BOUCLE_consigne>
