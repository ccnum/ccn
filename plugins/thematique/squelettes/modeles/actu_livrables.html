<BOUCLE_getArtforDoc(ARTICLES){id_article}>
	#SET{titreLivrable, #TITRE}
	<BOUCLE_getAuteur(RUBRIQUES){id_rubrique=#ID_RUBRIQUE}>
		#SET{titre, #TITRE}
		#SET{IdCouleur, #ID_RUBRIQUE}
	</BOUCLE_getAuteur>

	<BOUCLE_docs(DOCUMENTS){id_article}{0,1}{!par date}>
		<div class="actu-documents">
			<div class="actualites-actu bgc_classe_[(#GET{IdCouleur}|classe_numero)]">
				<button type="button" class="js-call-livrable btn-reset" data-id-article="#ID_ARTICLE">
					<span class="profil">[(#ID_RUBRIQUE|thematique_logo_carre)]</span>
					Nouveau document de #GET{titre}<br> sur #GET{titreLivrable}
				</button>
				<p class="date">[(#DATE|affdate)]</p>
				<INCLURE{fond=modeles/inc/vignette_document, id_document=#ID_DOCUMENT} />
			</div>
		</div>
	</BOUCLE_docs>

</BOUCLE_getArtforDoc>
