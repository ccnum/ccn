<form class='formulaire_spip formulaire_modifier_video_password' method='post' action='#ENV{action}'>
	<div>
		#ACTION_FORMULAIRE
		<input type='hidden' name='id_document' value='#ENV{id_document}' />
		[<div class="reponse_formulaire reponse_formulaire_ok" role="status">(#ENV**{message_ok})</div>]
		[<div class="reponse_formulaire reponse_formulaire_erreur" role="alert">(#ENV*{message_erreur})</div>]
		<label for="vimeo_password_#ENV{id_document}"><:api_vimeo:champ_vimeo_password:></label>
		<input type="password" autocomplete="new-password" class="text" name="vimeo_password" id="vimeo_password_#ENV{id_document}" placeholder="[(#ENV{a_un_mot_de_passe}|?{'••••••••',''})]" />
		<p class="explication"><:thematique:info_laisser_vide_mot_de_passe:></p>
		<input type='submit' class='btn submit btn_mini' value='<:bouton_enregistrer:>' />
	</div>
</form>
