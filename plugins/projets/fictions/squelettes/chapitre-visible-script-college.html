<!--
RUBRIQUE.HTML > CHAPITRE-VISIBLE.HTML > CHAPITRE-VISIBLE-SCRIPT-COLLEGE.HTML
(affichage du script college)
-->
<BOUCLE_chapitre_visible_script_college(ARTICLES){id_article}>
	<!-- AUTEUR DE L'ARTICLE -->
	<BOUCLE_auteur_article(AUTEURS){id_article}{0,1}>
		#SET{var_auteur_article, #NOM}
	</BOUCLE_auteur_article>
	<!-- SCRIPT COLLEGE -->
	<div class="script-college">
		<button type="button" class="script-open-close" id="open-script-college" aria-expanded="false" aria-controls="slideup-script-college" aria-label="<:fictions:afficher_le_script:>"></button>
		<div class="script-titre"><:fictions:script_titre_prefixe:>[ (#GET{var_auteur_article})]</div>
		<div class="script-texte script-texte-hide" id="slideup-script-college">#PS</div>
	</div>
</BOUCLE_chapitre_visible_script_college>
