<!--
PAGE-TYPE.HTML
(page de contenu type)
 -->
<INCLURE{fond=inclure/tete-html} />
<body>
<a href="#contenu-principal" class="skip-link"><:fictions:skip_contenu_principal:></a>
	<div id="liste-tooltip">
	</div>

	<INCLURE{fond=inclure/entete-ecriture} />

	<!-- BOOK -->
	<div id="global-ecriture">
		<a id="contenu-principal" tabindex="-1"></a>
		<div id="global-spacer">
		</div>
		<div class="global-content">
			<div class="content">
			<BOUCLE_annee(RUBRIQUES){titre==#EVAL{_ANNEE_SCOLAIRE}}{tout}{0,1}>
				<BOUCLE_art(ARTICLES){id_rubrique}{titre_mot=presentation}{tout}{0,1}>
				<div class="content-left-small">
					<INCLURE{fond=inclure/titre-site} />
					<div id="image-presentation">[(#LOGO_ARTICLE||image_reduire{100})]</div>
					<div id="texte-presentation" class="#EDIT{texte}">
						[(#TEXTE)]
					</div>
				</div>
				</BOUCLE_art>
			</BOUCLE_annee>
			<div class="content-right-large">
				<BOUCLE_page_article(ARTICLES){id_article}>
					<!-- TEXTE PAGE -->
					<div id="page-type">
						<div class="page-type-titre">
							#TITRE
						</div>
						<div class="page-type-texte #EDIT{texte}">
							#TEXTE
						</div>
					</div>
				</BOUCLE_page_article>
			</div>
		</div>
	</div>
	<INCLURE{fond=footer, annee_scolaire=#EVAL{_ANNEE_SCOLAIRE}} />
</body>

	<INCLURE{fond=modeles/js, page=page} />
</html>
