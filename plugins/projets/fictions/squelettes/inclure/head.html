[(#REM)
	Head standard de toutes les pages : socle commun (cadavrexquis,
	inclure/head-commun.html) + éléments propres à fictions
]
<INCLURE{fond=inclure/head-commun} />

[(#REM)Liens ouvrants — RGAA 13.3 : signaler l'ouverture dans un nouvel onglet]
<script type="text/javascript">
	$(document).ready(function() {
		$('a.spip_out,a.spip_url,a.spip_documents').each(function() {
			$(this).attr('target', '_blank')
			       .attr('rel', 'noopener noreferrer')
			       .attr('title', ($(this).attr('title') || $(this).text()).trim() + '<:fictions:suffixe_nouvelle_fenetre:>');
		});
	});
</script>
