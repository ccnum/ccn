<!-- AUTEUR DE L'ARTICLE -->
<BOUCLE_auteur_script(AUTEURS){id_article}{0,1}>
	#SET{var_auteur_article, #NOM}
</BOUCLE_auteur_script>

<div class="script-forum-fleche">
	<img src="#CHEMIN{img/ecriture/fleche_script_ecrivain.png}" alt="" width="44" height="17" />
</div>
<BOUCLE_article_verrouille_script(ARTICLES){id_article}{statut=prop}>
	<div class="script-ecrivain script-ecrivain-edit">
	    <div class="script-titre"><:fictions:script_titre_prefixe:>[ (#GET{var_auteur_article})]</div>
	    <div class="script-texte #EDIT{texte}">#TEXTE</div>
	    <br /><hr />
		<INCLURE{fond=inclure/script-documents, id_article, ajax=documents} />
		<div class="script-joindre ajax">
			#FORMULAIRE_CCN_JOINDRE_DOCUMENT{#ID_ARTICLE,article}
		</div>
	</div>

</BOUCLE_article_verrouille_script>
