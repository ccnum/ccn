
#SET{titre_fiche, ''}
<BOUCLE_fiche_intervenant(ARTICLES){id_rubrique=#ENV{id_rubrique}}{titre_mot=intervenant}{tous}{0,1}>
	#SET{titre_fiche, #TITRE}
</BOUCLE_fiche_intervenant>

<div class="sidebar_bubble header-reponse">
	<div id="row_header">
        <INCLURE{fond=noisettes/sidebar/inc/header_gauche_photo_auteur, id_rubrique} />
        <div id="header-col-right">
            <div id="header-row-1">
                <div class="etiquette-etape">
                    <span class="texte-etiquette">
                        <:thematique:intervenant:>
                    </span>
                </div>
                <INCLURE{fond=noisettes/sidebar/normal_header_icons} />
            </div>
            <div id="header-row-2">
                [(#GET{titre_fiche}|oui) #GET{titre_fiche}]
                [(#GET{titre_fiche}|non) <:thematique:pas_de_description:>]
            </div>
        </div>
	</div>
</div>
