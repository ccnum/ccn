<div class="bloc_article">
	<div>
		<INCLURE{
			fond=noisettes/sidebar/page_participant/header_intervenant,
			id_rubrique=#ENV{id_rubrique},
			ajax,
			env
		} />
	</div>
	#SET{libelle_discussions, #VAL{thematique:titre_onglet_commentaires}|_T}
	<BOUCLE_fiche_intervenant(ARTICLES){id_rubrique=#ENV{id_rubrique}}{titre_mot=intervenant}{tous}{0,1}>
        <div class="container-tabs">
            <div id="mission-tabs">
                <div>
                    <div class="tabs-title">
                        <:thematique:presentation:>
                    </div>
                    <div class="tabs-content">
                        <div class="bouton-modifier-container">
                            <INCLURE{fond=noisettes/sidebar/inc/bouton_modifier_article, id_article=#ID_ARTICLE, type_objet=intervenant} />
                        </div>
                        <INCLURE{fond=noisettes/sidebar/page_participant/onglet_description_intervenant, id_article=#ID_ARTICLE} />
                    </div>
                </div>
                <INCLURE{fond=noisettes/sidebar/inc/onglet_commentaires_tab, env, id_article=#ID_ARTICLE, libelle_onglet=#GET{libelle_discussions}} />
            </div>
        </div>
	</BOUCLE_fiche_intervenant>
</div>
