#CACHE{0}
<div id="tabs-article-#ID_ARTICLE" class="container-tabs">
	<div id="mission-tabs">
		<INCLURE{
			fond=noisettes/sidebar/inc/onglet_description_mission_tab,
			fond_description=noisettes/sidebar/onglet_description_role_simple,
			id_article=#ENV{id_article},
			env
		} />
		<div>
			<div class="tabs-title">
				<:thematique:titre_onglet_liste_des_reponses:>
			</div>
			<div class="tabs-content">
				<INCLURE{fond=noisettes/sidebar/onglet_reponses_intervenant, id_article=#ID_ARTICLE, env, ajax} />
			</div>
		</div>
		#SET{libelle_onglet_commentaires, #VAL{thematique:titre_onglet_comentaire}|_T}
		<INCLURE{fond=noisettes/sidebar/inc/onglet_commentaires_tab, libelle_onglet=#GET{libelle_onglet_commentaires}, env} />
	</div>
</div>
