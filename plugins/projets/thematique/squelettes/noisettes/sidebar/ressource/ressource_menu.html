<div class="ressource-menu">
    <div class="ressource-header">
        <div class="ressource-header-icons">
            <INCLURE{fond=noisettes/sidebar/normal_header_icons, env} />
        </div>
        <div class="ressource-header-etiquette">
            <div class="etiquette-etape">
                <img class="logo-etiquette" src="" alt="">
                <span class="texte-etiquette"><:thematique:ressources:></span>
            </div>
        </div>
        <div>
            <strong><:thematique:texte_accueil_ressource:></strong>
        </div>
    </div>
    <div class="ressource-content">
        <BOUCLE_rubrique(RUBRIQUES){titre_mot=ressources}{racine}{0,1}>
            <div class="filter-buttons">
                <button type="button"
                        class="filtre-ressources actif"
                        data-id-rubrique=""
                        onclick="filtrerRessources(this)"
                >
                    <:thematique:filtre_ressources_tout:>
                </button>
                <BOUCLE_sous_rubriques(RUBRIQUES){id_parent}{par num titre, titre}{tout}>
                    <button type="button"
                            class="filtre-ressources"
                            data-id-rubrique="#ID_RUBRIQUE"
                            onclick="filtrerRessources(this)"
                    >
                        #TITRE
                    </button>
                </BOUCLE_sous_rubriques>
            </div>
            <div class="ressource-liste-container">
                <div class="encadre-message">
                    <div>
                        <:thematique:message_encadre_ressource:>
                    </div>
                    <button onclick="callNouvelleRessource()"
                            class="bouton-lisere">
                        <:thematique:publier_bandeau_ressource:>
                    </button>
                </div>
                <div class="liste-ressources">
                    <BOUCLE_articles(ARTICLES){id_secteur}{par date}{tous}>
                        <BOUCLE_auteur(AUTEURS){id_article}>
                            #SET{nom_auteur, #NOM}
                        </BOUCLE_auteur>
                        <INCLURE{
                            fond=noisettes/sidebar/ressource/ressource_card,
                            date=#DATE,
                            titre=#TITRE,
                            nom_auteur=#GET{nom_auteur},
                            id_article=#ID_ARTICLE,
                            id_rubrique=#ID_RUBRIQUE,
                            env
                        } />
                    </BOUCLE_articles>
                </div>
            </div>
        </BOUCLE_rubrique>
    </div>
</div>
