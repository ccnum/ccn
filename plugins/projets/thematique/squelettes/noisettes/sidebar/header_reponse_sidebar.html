[(#REM)
Arguments :
- id_article
- titre_parent
- titre_consigne
- id_consigne
- type_objet
- rang
]
#CACHE{0}
<BOUCLE_article_sidebar(ARTICLES){id_article}{tout}>
<div class="sidebar_bubble header-reponse">
	<div id="row_header" class="header-reponse-grid" style="background-color: var(--color-classe-light-[(#ENV{id_rubrique}|classe_numero)]);">
		<div id="header-col-left">
			<div class="image-classe-dans-reponse">
				<INCLURE{fond=modeles/classe_icone, id_rubrique=#ID_RUBRIQUE, titre=#ENV{titre_parent}} />
			</div>
			<div class="#EDIT{titre} titre">
				<BOUCLE_nom_ecole(RUBRIQUES){id_rubrique}{tout}>
					#TITRE
				</BOUCLE_nom_ecole>
			</div>
			<div class="#EDIT{date} date">
				<span><:thematique:publie_le:></span>
				<span>[(#DATE|affdate)]</span>
			</div>
		</div>
		<div id="header-col-right">
			<div id="header-row-1">
				#SET{numero_mission, #ENV{rang}|sinon{0}|plus{1}}
				<div class="etiquette-etape">
					<span class="texte-etiquette"><:thematique:reponse_mission_numero{numero=#GET{numero_mission}}:></span>
				</div>
				<INCLURE{fond=noisettes/sidebar/normal_header_icons} />
			</div>
			<div id="header-row-2" class="#EDIT{titre}" style="border-bottom: 2px solid var(--color-classe-light-[(#ENV{id_rubrique}|classe_numero)])">
				#TITRE
			</div>
		</div>
	</div>
</div>
</BOUCLE_article_sidebar>
