[(#REM)
-href
-filter
-class
-title
-valeur
-style
-onclick
-texte
-numero
-icone
]

<li class="logo" style="position: relative;">
	<a 	[href="(#HREF)"]
		[rel="(#REL)"]
		[data-filter-value="(#FILTER)"]
		[data-option-value="(#OPTION)"]
		onClick="callClasse([(#ENV{valeur}|intval)]);"
		class="[(#TEXTE|=={''}|oui)[logo_menu-(#VALEUR)]] #CLASS logo_menu_classe tooltip bgc_classe_#ENV{numero}"
		data-tip="#TITLE"[(#HREF|non) role="button" tabindex="0"]>
		<span role="img" aria-label="#TITLE" style="font-size:min(70cqw,70cqh)">#ENV{icone}</span>
	</a>
</li>
