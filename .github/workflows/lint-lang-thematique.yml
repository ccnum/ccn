name: Lint - texte en dur (plugin thematique)

on:
  pull_request:
    paths:
      - 'plugins/thematique/**'
      - '.ci/**'
  push:
    branches:
      - dev
      - main
    paths:
      - 'plugins/thematique/**'
      - '.ci/**'

jobs:
  check-lang-hardcoded:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Vérifier l'absence de nouveau texte en dur
        run: python3 .ci/check_lang_hardcoded.py

      - name: Vérifier la validité des clés de langue référencées
        run: python3 .ci/check_lang_keys.py
