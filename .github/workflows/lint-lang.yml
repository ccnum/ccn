name: Lint - texte en dur (thematique, fictions, petitfablab, ccn)

on:
  pull_request:
    paths:
      - 'plugins/projets/thematique/**'
      - 'plugins/projets/fictions/**'
      - 'plugins/projets/petitfablab/**'
      - 'plugins/projets/ccn/**'
      - '.ci/**'

jobs:
  check-lang-hardcoded:
    # Pas de déclencheur push (dev/main) : build_dev.yml fait déjà tourner ces
    # mêmes checks (jobs lang_hardcoded/lang_keys/hardcoded_paths) à chaque
    # push sur dev - éviter le doublon en parallèle. main ne reçoit que des
    # merges de PR (déjà couverts par le déclencheur pull_request ci-dessus).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Vérifier l'absence de nouveau texte en dur
        run: python3 .ci/check_lang_hardcoded.py

      - name: Vérifier la validité des clés de langue référencées
        run: python3 .ci/check_lang_keys.py

      - name: Vérifier l'absence de nouveau lien en dur (hors #CHEMIN)
        run: python3 .ci/check_hardcoded_paths.py
