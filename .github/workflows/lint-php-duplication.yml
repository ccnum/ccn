name: Lint - duplication PHP (thematique, fictions, petitfablab, ccn)

on:
  pull_request:
    paths:
      - 'plugins/projets/thematique/**/*.php'
      - 'plugins/projets/fictions/**/*.php'
      - 'plugins/projets/petitfablab/**/*.php'
      - 'plugins/projets/ccn/**/*.php'
      - '.ci/check_php_duplication.js'
      - '.ci/php-duplication-baseline.txt'
      - 'package.json'
      - 'package-lock.json'

jobs:
  check-php-duplication:
    # Pas de déclencheur push (dev/main) : build_dev.yml fait déjà tourner ce
    # même check (job php_duplication) à chaque push sur dev - éviter le
    # doublon en parallèle. main ne reçoit que des merges de PR (déjà
    # couverts par le déclencheur pull_request ci-dessus).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier l'absence de nouvelle duplication PHP
        run: node .ci/check_php_duplication.js
