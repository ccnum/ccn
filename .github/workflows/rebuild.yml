name: Rebuild Docker Images

# Reconstruit chaque nuit les images dev et latest à partir du code déjà publié,
# pour reprendre les correctifs de sécurité de l'image de base (PHP, Debian).
# Pas de lint ni de nouveau tag de version : le code n'a pas changé.
# Un pod ne prend la nouvelle image qu'à son redémarrage (imagePullPolicy: Always).

on:
  schedule:
    - cron: '0 20 * * *' # 22h en heure d'été, 21h en heure d'hiver
  workflow_dispatch:

jobs:
  spip:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: dev
            tag: dev
          - branch: main
            tag: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          pull: true
          no-cache: true
          context: .
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: erasme/spip-ccn:${{ matrix.tag }}
