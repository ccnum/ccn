name: Rebuild Docker Images

# Reconstruit les images dev et latest quand une nouvelle version de PHP est publiée :
# toutes les heures, compare la variable PHP_VERSION de l'image de base (FROM du
# Dockerfile de la branche) à celle de notre image publiée (héritée de la base).
# Pas de lint ni de nouveau tag de version : le code n'a pas changé.
# L'image de prod (latest) n'est reconstruite qu'entre 18h et 8h (heure de Paris) :
# son redéploiement redémarre les sites. dev l'est dès la sortie de la version.
# Un déclenchement manuel reconstruit les deux images sans comparer, à toute heure.
# Un pod ne prend la nouvelle image qu'à son redémarrage (imagePullPolicy: Always).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compare.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare PHP versions
        id: compare
        env:
          CREDS: ${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          php_version() {
            skopeo inspect --retry-times 3 --config --creds "$CREDS" "docker://docker.io/$1" \
              | jq -r '.config.Env[] | select(startswith("PHP_VERSION=")) | sub("PHP_VERSION="; "")'
          }
          heure=$(TZ=Europe/Paris date +%-H)
          hors_journee=$([ "$heure" -ge 18 ] || [ "$heure" -lt 8 ] && echo true || echo false)
          matrix='[]'
          for pair in dev:dev main:latest; do
            branch=${pair%%:*}
            tag=${pair#*:}
            base=$(git show "origin/$branch:Dockerfile" | awk '/^FROM/ { print $2; exit }')
            base_version=$(php_version "$base")
            current_version=$(php_version "erasme/spip-ccn:$tag" || true)
            echo "$tag : PHP ${current_version:-inconnue}, $base : PHP $base_version"
            if [ "$FORCE" != true ] && [ "$tag" = latest ] && [ "$hors_journee" != true ]; then
              echo "latest : hors plage 18h-8h (${heure}h à Paris), pas de build"
              continue
            fi
            if [ "$FORCE" = true ] || [ "$current_version" != "$base_version" ]; then
              matrix=$(jq -c --arg branch "$branch" --arg tag "$tag" '. + [{branch: $branch, tag: $tag}]' <<< "$matrix")
            fi
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  spip:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          pull: true
          no-cache: true
          context: .
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: erasme/spip-ccn:${{ matrix.tag }}
