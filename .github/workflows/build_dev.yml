name: Build and Push Docker Images

on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Vérifier l'absence de nouveau texte en dur
        run: python3 .ci/check_lang_hardcoded.py

      - name: Vérifier la validité des clés de langue référencées
        run: python3 .ci/check_lang_keys.py

  spip:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: erasme/spip-ccn:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
