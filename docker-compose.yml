services:
  db:
    image: mariadb:11.8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=ChangeMeRootPassword!
      - MYSQL_DATABASE=spip
      - MYSQL_USER=spip
      - MYSQL_PASSWORD=ChangeMeSpipDbPassword!
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: erasme/spip-ccn:custom-port
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPIP_AUTO_INSTALL=1
      - SPIP_DB_SERVER=mysql
      - SPIP_DB_HOST=db
      - SPIP_DB_LOGIN=spip
      - SPIP_DB_PASS=ChangeMeSpipDbPassword!
      - SPIP_DB_NAME=spip
      - SPIP_ADMIN_PASS=ChangeMeAdminPassword!
      - SPIP_SITE_ADDRESS=http://localhost:8880
    # Le code est dans l'image : ne monter que les données à conserver, jamais
    # /var/www/html (il masquerait le code). Pas tmp/ entier, seulement tmp/log :
    # perdre les sessions force la reconnexion, et donc le recalcul du rôle,
    # après une mise à jour de l'image.
    volumes:
      - spip_img:/var/www/html/IMG
      - spip_config:/var/www/html/config
      - spip_log:/var/www/html/tmp/log
    ports:
      - 8880:80

volumes:
  db_data:
  spip_img:
  spip_config:
  spip_log: